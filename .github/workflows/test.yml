name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The extension's native host runs #!/usr/bin/node, the path of Arch's nodejs
      # package that the install requires. Put the selected Node there and check it.
      - name: Provide Node at /usr/bin/node
        run: |
          [ -e /usr/bin/node ] || sudo ln -s "$(command -v node)" /usr/bin/node
          test "$(/usr/bin/node --version)" = "$(node --version)"
          /usr/bin/node --version
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm test
