name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - run: npm test
