<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>VidCapture panel</title>
  <link rel="stylesheet" href="surfaces.css">
</head>
<body class="panel">
  <!-- Icons: Tabler Icons (MIT License, Copyright (c) 2020-2024 Paweł Kuna), https://tabler.io/icons -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-window" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/><path d="M6 8h.01"/><path d="M9 8h.01"/></symbol>
    <symbol id="i-marquee" viewBox="0 0 24 24"><path d="M4 6v-1a1 1 0 0 1 1 -1h1m5 0h2m5 0h1a1 1 0 0 1 1 1v1m0 5v2m0 5v1a1 1 0 0 1 -1 1h-1m-5 0h-2m-5 0h-1a1 1 0 0 1 -1 -1v-1m0 -5v-2m0 -5"/></symbol>
    <symbol id="i-desktop" viewBox="0 0 24 24"><path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10z"/><path d="M7 20h10"/><path d="M9 16v4"/><path d="M15 16v4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M5 7h1a2 2 0 0 0 2 -2a1 1 0 0 1 1 -1h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v9a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2"/><path d="M9 13a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/></symbol>
    <symbol id="i-camera-off" viewBox="0 0 24 24"><path d="M8.297 4.289a.997 .997 0 0 1 .703 -.289h6a1 1 0 0 1 1 1a2 2 0 0 0 2 2h1a2 2 0 0 1 2 2v8m-1.187 2.828c-.249 .11 -.524 .172 -.813 .172h-14a2 2 0 0 1 -2 -2v-9a2 2 0 0 1 2 -2h1c.298 0 .58 -.065 .834 -.181"/><path d="M10.422 10.448a3 3 0 1 0 4.15 4.098"/><path d="M3 3l18 18"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 5a3 3 0 0 1 6 0v5a3 3 0 0 1 -.13 .874m-2 2a3 3 0 0 1 -3.87 -2.872v-1"/><path d="M5 10a7 7 0 0 0 10.846 5.85m2 -2a6.967 6.967 0 0 0 1.152 -3.85"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M9 5a3 3 0 0 1 3 -3a3 3 0 0 1 3 3v5a3 3 0 0 1 -3 3a3 3 0 0 1 -3 -3z"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M17.7 5a9 9 0 0 1 0 14"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M12 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 6h8"/><path d="M16 6h4"/><path d="M6 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 12h2"/><path d="M10 12h10"/><path d="M15 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M4 18h11"/><path d="M19 18h1"/></symbol>
    <symbol id="i-pointer" viewBox="0 0 24 24"><path d="M7.904 17.563a1.2 1.2 0 0 0 2.228 .308l2.09 -3.093l4.907 4.907a1.067 1.067 0 0 0 1.509 0l1.047 -1.047a1.067 1.067 0 0 0 0 -1.509l-4.907 -4.907l3.113 -2.09a1.2 1.2 0 0 0 -.309 -2.228l-13.582 -3.904l3.904 13.563z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6l6 -6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5l10 -10"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6l-12 12"/><path d="M6 6l12 12"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/><path d="M14 6a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13 -8z"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M19.95 11a8 8 0 1 0 -.5 4m.5 5v-5h-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7l16 0"/><path d="M10 11l0 6"/><path d="M14 11l0 6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v3"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><path d="M5 7a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z"/></symbol>
  </svg>

  <main class="sheet" id="sheet">
    <header class="sheet-head">
      <span class="brand"><img src="icon.svg" alt="">VidCapture</span>
      <button type="button" class="text-btn" id="recordings"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg>Recordings</button>
      <button type="button" class="icon-btn" id="close" aria-label="Close" title="Close (Esc)"><svg class="icon"><use href="#i-x"/></svg></button>
    </header>

    <section id="setup">
      <div class="scroll" id="scroll">
        <div class="tabs" role="tablist" aria-label="What to record">
          <button type="button" role="tab" id="tab-screen" data-tab="screen" aria-controls="source-screen" aria-selected="true"><svg class="icon" aria-hidden="true"><use href="#i-desktop"/></svg>Full screen</button>
          <button type="button" role="tab" id="tab-window" data-tab="window" aria-controls="source-window" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-window"/></svg>Window</button>
          <button type="button" role="tab" id="tab-area" data-tab="area" aria-controls="source-area" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-marquee"/></svg>Area</button>
          <button type="button" role="tab" id="tab-camera" data-tab="camera" aria-controls="source-camera" aria-selected="false" tabindex="-1"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg>Camera</button>
        </div>

        <div class="source" id="source-screen" role="tabpanel" aria-labelledby="tab-screen">
          <div class="displays" id="displays"></div>
        </div>
        <div class="source" id="source-window" role="tabpanel" aria-labelledby="tab-window" hidden>
          <button type="button" class="row-btn" id="click-window"><svg class="icon" aria-hidden="true"><use href="#i-pointer"/></svg>Click a window on screen</button>
          <ul class="windows" id="windows" aria-label="Open windows"></ul>
        </div>
        <div class="source" id="source-area" role="tabpanel" aria-labelledby="tab-area" hidden>
          <button type="button" class="row-btn" id="draw-area"><svg class="icon" aria-hidden="true"><use href="#i-marquee"/></svg><span id="draw-label">Draw an area on screen</span></button>
          <div class="picked" id="area-state" hidden>
            <span class="mini"><svg class="icon" aria-hidden="true"><use href="#i-marquee"/></svg></span>
            <span class="window-text"><span class="window-title">Area</span><span class="window-meta mono" id="area-size"></span></span>
            <svg class="icon tick" aria-hidden="true"><use href="#i-check"/></svg>
          </div>
        </div>

        <div class="source" id="source-camera" role="tabpanel" aria-labelledby="tab-camera" hidden>
          <ul class="windows" id="cameras" aria-label="Cameras"></ul>
        </div>

        <div class="devices">
          <div class="device">
            <button type="button" class="select" id="camera-select" aria-haspopup="menu" aria-expanded="false" aria-label="Camera"><svg class="icon" aria-hidden="true"><use href="#i-camera"/></svg><span class="value" id="camera-value">No camera</span><svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg></button>
            <button type="button" class="icon-btn" id="preview" aria-pressed="false" aria-label="Show camera" title="Show camera"><svg class="icon"><use href="#i-eye"/></svg></button>
          </div>
          <div class="device">
            <button type="button" class="select" id="mic-select" aria-haspopup="menu" aria-expanded="false" aria-label="Microphone"><svg class="icon" aria-hidden="true"><use href="#i-mic"/></svg><span class="value" id="mic-value">Default microphone</span><span class="level" id="mic-level" hidden><span></span></span><svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg></button>
          </div>
          <label class="toggle-row"><svg class="icon" aria-hidden="true"><use href="#i-volume"/></svg><span>System audio</span><input type="checkbox" id="system-audio" role="switch"></label>
        </div>

        <button type="button" class="more" id="more" aria-expanded="false" aria-controls="settings"><svg class="icon" aria-hidden="true"><use href="#i-sliders"/></svg>More settings<svg class="icon chev" aria-hidden="true"><use href="#i-chevron"/></svg></button>
        <div class="settings" id="settings" hidden>
          <div class="setting"><span>Countdown</span><div class="seg" data-key="countdown" role="group" aria-label="Countdown"><button type="button" data-v="3">3 seconds</button><button type="button" data-v="0">Off</button></div></div>
          <div class="setting"><span>Quality</span><div class="seg" data-key="quality" role="group" aria-label="Quality"><button type="button" data-v="high">High</button><button type="button" data-v="very_high">Very high</button><button type="button" data-v="ultra">Ultra</button></div></div>
          <div class="setting"><span>Frame rate</span><div class="seg" data-key="fps" role="group" aria-label="Frame rate"><button type="button" data-v="30">30</button><button type="button" data-v="60">60</button></div></div>
          <div class="setting"><span>Resolution</span><div class="seg" data-key="resolution" role="group" aria-label="Resolution"><button type="button" data-v="0x0">Match source</button><button type="button" data-v="1920x1080">1080p</button></div></div>
          <div class="setting"><span>Camera size</span><div class="seg" data-key="cameraSize" role="group" aria-label="Camera size"><button type="button" data-v="small">Small</button><button type="button" data-v="medium">Medium</button><button type="button" data-v="large">Large</button></div></div>
          <div class="setting"><span>Camera corner</span><div class="seg" data-key="cameraCorner" role="group" aria-label="Camera corner"><button type="button" data-v="bottom-left">Left</button><button type="button" data-v="bottom-right">Right</button></div></div>
          <div class="setting"><span>Camera lighting</span><div class="seg" data-key="cameraLighting" role="group" aria-label="Camera lighting"><button type="button" data-v="original">Original</button><button type="button" data-v="balanced">Balanced</button></div></div>
          <div class="setting"><span>Lens correction</span><div class="seg" data-key="cameraCorrection" role="group" aria-label="Lens correction"><button type="button" data-v="computer">On</button><button type="button" data-v="off">Off</button></div></div>
        </div>
      </div>

      <div class="foot">
        <p class="error" id="error" role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span id="error-text"></span></p>
        <p class="hint" id="hint" hidden></p>
        <button type="button" class="start" id="start" aria-describedby="hint"><span class="rec-dot" aria-hidden="true"></span>Start recording</button>
      </div>
    </section>

    <section id="live" hidden>
      <div class="live-time" role="timer" aria-label="Elapsed time"><span class="rec-dot" id="live-dot" aria-hidden="true"></span><span id="live-elapsed">0:00</span></div>
      <p class="live-what" id="live-what"></p>
      <div class="live-actions" id="live-actions">
        <button type="button" class="quiet-btn" id="live-pause"><svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg><span>Pause</span></button>
        <button type="button" class="stop-btn" id="live-stop"><svg class="icon" aria-hidden="true"><use href="#i-stop"/></svg>Stop and save</button>
        <button type="button" class="plain-btn" id="live-restart"><svg class="icon" aria-hidden="true"><use href="#i-restart"/></svg>Restart</button>
        <button type="button" class="plain-btn" id="live-discard"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>Delete take</button>
      </div>
      <div class="live-confirm" id="live-confirm" role="group" aria-labelledby="live-confirm-text" hidden>
        <p class="live-confirm-text" id="live-confirm-text"></p>
        <div class="live-actions">
          <button type="button" class="quiet-btn" id="live-confirm-cancel">Cancel</button>
          <button type="button" class="stop-btn" id="live-confirm-go"></button>
        </div>
      </div>
    </section>

    <div class="menu" id="camera-menu" role="menu" aria-label="Camera" hidden></div>
    <div class="menu" id="mic-menu" role="menu" aria-label="Microphone" hidden></div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
