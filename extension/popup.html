<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VidCapture</title><link rel="stylesheet" href="popup.css"></head>
<body>
 <header><a class="brand" href="#" id="app" aria-label="Open VidCapture desktop app"><img src="icons/icon-32.png" alt="" width="28" height="28"><span>VidCapture</span></a><button class="quiet" id="library" type="button">Online library <span aria-hidden="true">↗</span></button></header>
 <main>
  <section class="hero" aria-labelledby="heading">
   <div class="scene" aria-hidden="true"><div class="scene-window"><div class="scene-chrome"><i></i><i></i><i></i></div><div class="scene-content"><span></span><span></span><span></span><b></b></div></div><div class="scene-camera"><svg viewBox="0 0 32 32"><circle cx="16" cy="11" r="5"/><path d="M6 28c0-7 4-11 10-11s10 4 10 11"/></svg></div><div class="scene-record"><span></span><span id="scene-time">Ready when you are</span></div></div>
   <div class="headline"><h1 id="heading">A little more personal.</h1><p id="subheading">Your screen, your voice, your camera.</p></div>
  </section>
  <div class="connection" id="connection" role="status"><span class="connection-dot"></span><span id="connection-text">Connecting to VidCapture…</span><button id="retry" class="quiet" type="button" hidden>Retry</button></div>
  <section id="setup" aria-label="Recording setup">
   <fieldset class="source-mode"><legend>What would you like to record?</legend><div class="segments" role="group" aria-label="Recording source"><button type="button" data-mode="monitor" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21h8m-4-4v4"/></svg>Screen</button><button type="button" data-mode="window" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 9h18"/></svg>Window</button><button type="button" data-mode="region" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 8h8v8H8z"/></svg>Area</button><button type="button" data-mode="camera" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-4v12l-6-4"/></svg>Camera</button></div></fieldset>
   <label class="source-choice" id="source-label"><span class="sr-only">Screen to record</span><select id="source"><option value="">Choose a screen</option></select></label>
   <button id="pick" class="area-pick" type="button" hidden>Draw an area <span aria-hidden="true">↗</span></button>
   <p id="camera-note" class="camera-note" hidden>Just your camera, without your screen.</p>
   <div class="devices">
    <div class="device"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-4v12l-6-4"/></svg><label for="camera">Camera<select id="camera"><option value="none">Camera off</option></select></label><button id="preview" class="preview" type="button" aria-pressed="false" title="Show camera preview">Preview</button></div>
    <div class="device"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></svg><label for="microphone">Microphone<select id="microphone"><option value="none">Microphone off</option></select></label></div>
   </div>
   <div class="preferences"><label class="toggle"><input id="system-audio" type="checkbox"><span class="switch" aria-hidden="true"></span>Computer audio</label><label class="toggle"><input id="countdown" type="checkbox"><span class="switch" aria-hidden="true"></span>3-second countdown</label></div>
  </section>
  <section id="session" hidden aria-label="Current recording"><div class="session-meta"><span id="session-label">Recording</span><time id="elapsed">00:00</time></div><p id="target-name"></p><div class="session-actions"><button id="pause" class="secondary" type="button">Pause</button><button id="stop" class="stop" type="button"><span aria-hidden="true">■</span> Stop and save</button></div></section>
  <div id="error" class="error" role="alert" hidden></div>
  <button id="record" class="record" type="button" disabled><span class="record-dot" aria-hidden="true"></span><span id="record-label">Start recording</span><span class="arrow" aria-hidden="true">↗</span></button>
  <section id="saved" class="saved" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg><div><strong>Saved on your computer</strong><span id="saved-name"></span></div><button id="edit" class="quiet" type="button">Open editor ↗</button></section>
 </main>
 <footer><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4 4 7 8 9 4-2 8-5 8-9V6z"/><path d="m8 12 3 3 5-6"/></svg><p id="footnote">Recorded by the desktop app. Share when you’re ready.</p></footer>
 <script src="popup.js"></script>
</body></html>
